<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Wren Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: one narrow case-file column; a lock tracker on top, one lock card at a time below. Steel ground, brass hardware, paper cipher tape. */
:root{
  --bg:#E6EBEE; --panel:#F8FAFB; --ink:#14212B; --muted:#4F5E69; --line:#C3CDD3;
  --brass:#8E6210; --brass-soft:#EAD8AC; --tape:#F4E9CB; --tape-ink:#2B2310;
  --ok:#1F6B4B; --ok-soft:#D3EBDF; --warn:#A2372E; --warn-soft:#F5DCD8; --hl:#FFD86B;
  --f-display:"Saira Stencil One","Arial Black",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151A; --panel:#16212A; --ink:#E3E9ED; --muted:#97A6B0; --line:#2B3B47;
  --brass:#DDAA4C; --brass-soft:#3A2E14; --tape:#251F12; --tape-ink:#F1E3BE;
  --ok:#62C796; --ok-soft:#173527; --warn:#F2867B; --warn-soft:#3E1D1A; --hl:#6B5413; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151A; --panel:#16212A; --ink:#E3E9ED; --muted:#97A6B0; --line:#2B3B47;
  --brass:#DDAA4C; --brass-soft:#3A2E14; --tape:#251F12; --tape-ink:#F1E3BE;
  --ok:#62C796; --ok-soft:#173527; --warn:#F2867B; --warn-soft:#3E1D1A; --hl:#6B5413; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.25rem;letter-spacing:.04em}
.brand svg{width:34px;height:34px;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.brand.spin svg{transform:rotate(360deg)}
.track{display:flex;gap:6px;align-items:center}
.pip{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);background:var(--panel)}
.pip.now{border-color:var(--brass);color:var(--brass)}
.pip.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:.85rem}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600}
.big{font-family:var(--f-display);font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;letter-spacing:.02em}
.h2{font-family:var(--f-display);font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.05;letter-spacing:.02em}
.lede{font-size:1.15rem;max-width:62ch}
.label{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:8px}
.note{border-left:4px solid var(--brass);padding:4px 0 4px 14px;max-width:64ch}
ul.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.safe{background:var(--ok-soft);border-radius:10px;padding:14px 16px;font-size:.95rem}

.go{align-self:flex-start;background:var(--ink);color:var(--panel);border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.go:hover{background:var(--brass);color:var(--ink)}

/* cipher tape */
.tape{background:var(--tape);color:var(--tape-ink);border-radius:8px;padding:16px 18px;font-family:var(--f-mono);font-weight:600;
  font-size:clamp(1.05rem,3.2vw,1.35rem);letter-spacing:.14em;line-height:1.9;word-break:break-word;
  border-top:2px dashed var(--brass);border-bottom:2px dashed var(--brass)}
.tape .ml{cursor:pointer;border-radius:3px;padding:0 1px}
.tape .ml:hover{background:var(--brass-soft)}
.tape .ml.hl{background:var(--hl)}

/* decoder */
.dec{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-size:1.3rem;font-weight:700;line-height:1}
.step:hover{background:var(--brass-soft)}
.num{font-family:var(--f-mono);font-size:1.8rem;font-weight:600;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:140px;accent-color:var(--brass)}
.preview{font-family:var(--f-mono);font-size:.95rem;color:var(--muted)}
.preview b{color:var(--ink);letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--f-mono);font-weight:600;cursor:pointer;background:var(--panel)}
.cell span{display:block;width:100%;text-align:center;padding:3px 0;font-size:clamp(.8rem,2.4vw,1.05rem)}
.cell .t{background:var(--tape);color:var(--tape-ink)}
.cell .b{color:var(--ink)}
.cell.hl{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.cell.hl .b{background:var(--hl)}
.keyin{font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:min(100%,280px)}
.legend{font-size:.85rem;color:var(--muted)}

textarea{width:100%;min-height:96px;resize:vertical;font-family:var(--f-mono);font-size:1rem;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);box-sizing:border-box}

/* answer */
.ans{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ans input{flex:1;min-width:0;max-width:320px;font-family:var(--f-mono);font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink)}
.msg{font-weight:700;min-height:1.5em}
.msg.bad{color:var(--warn)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--brass-soft);border-radius:8px;padding:10px 14px;font-size:.95rem}

/* reveal */
.reveal{border:2px solid var(--ok);background:var(--ok-soft)}
.stamp{align-self:flex-start;font-family:var(--f-display);color:var(--ok);border:3px solid var(--ok);border-radius:6px;padding:2px 12px;font-size:1.4rem;letter-spacing:.08em;transform:rotate(-3deg)}
.plain{font-family:var(--f-mono);font-weight:600;letter-spacing:.1em;background:var(--panel);border-radius:8px;padding:12px 14px}

/* vault */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink)}
.opt:hover{border-color:var(--brass)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.fb{border-radius:10px;padding:12px 16px;background:var(--warn-soft);color:var(--ink)}
.final{font-family:var(--f-mono);font-weight:600;font-size:clamp(1.15rem,3.6vw,1.6rem);letter-spacing:.1em;line-height:1.6;background:var(--tape);color:var(--tape-ink);border-radius:10px;padding:18px 20px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.danger{background:var(--warn);color:var(--panel);border:0;border-radius:8px;padding:6px 12px;font-weight:700}

@media (max-width:460px){.card{padding:18px}.grid{gap:3px}}
@media (prefers-reduced-motion:reduce){.brand svg{transition:none}}
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand" id="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="var(--panel)" stroke="var(--brass)" stroke-width="3"/>
        <circle cx="20" cy="20" r="11" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <g stroke="var(--ink)" stroke-width="2" stroke-linecap="round">
          <line x1="20" y1="4" x2="20" y2="8"/><line x1="36" y1="20" x2="32" y2="20"/>
          <line x1="20" y1="36" x2="20" y2="32"/><line x1="4" y1="20" x2="8" y2="20"/>
        </g>
        <line x1="20" y1="20" x2="20" y2="11" stroke="var(--brass)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      WREN VAULT
    </div>
    <div class="track" id="track" aria-label="Lock progress"></div>
  </div>
  <main id="stage"></main>
  <div id="resetZone"></div>
</div>

<script>
(function(){
const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const KEY="wrenVault.v1";
// codewords are stored scrambled (ROT13 + reversed) so they are not sitting in plain text
const unob=s=>s.split("").reverse().map(c=>A.includes(c)?A[(A.indexOf(c)+13)%26]:c).join("");
const norm=s=>(s||"").toUpperCase().replace(/[^A-Z]/g,"");

const LOCKS=[
 {name:"The Shift", tool:"shift",
  cipher:"QLFH ZRUN, FUHZ. WKH QHAW ORFN KLGHV LWV NHB. FRGHZRUG: ODQWHUQ",
  note:"My first trick: I slid every letter 3 spots forward in the alphabet. A became D. B became E. To read it, slide the decoder to 3. Then find each scrambled letter in the top row and write down the real letter under it.",
  hints:["With the decoder on 3, find Q in the top row. The real letter under it is N.","The codeword is the last word of the message."],
  ans:"AERGANY",
  named:"a Caesar cipher",
  why:"Julius Caesar used this exact trick, a shift of 3, to send army orders about 2,000 years ago. The key is one number: how far each letter moves."},
 {name:"The Missing Number", tool:"shift",
  cipher:"ZYWJ EHPYEJ QTGP DSTQED EZ ECJ. YPIE WZNV TD L XTCCZC. NZOPHZCO: ZCMTE",
  note:"Same trick as Lock 1. This time I kept the number to myself. Nobody is going to hand you the key. How could your crew find it anyway?",
  hints:["Move the decoder one step at a time and watch the first-word preview. Stop when it turns into a real word.","There are only 25 shifts to try. Split them up across your crew."],
  ans:"GVOEB",
  named:"a brute-force search",
  why:"You tried every possible key until one worked. A Caesar cipher only has 25 keys, so a patient crew breaks it in minutes. Few keys means a weak lock."},
 {name:"The Mirror", tool:"mirror",
  cipher:"GSV OZHG OLXP FHVH Z PVBDLIW. BLFI URIHG XLWVDLIW RH GSV PVB. XLWVDLIW: XLNKZHH",
  note:"I folded the alphabet in half. A trades places with Z. B trades with Y. C trades with X. The decoder already knows the fold. Read carefully, because this message tells you how to open the last lock.",
  hints:["Find G in the top row. The real letter under it is T.","The second sentence tells you what to bring to Lock 4. Check your notes from Lock 1."],
  ans:"FFNCZBP",
  named:"the Atbash cipher",
  why:"People used this mirror trick with the Hebrew alphabet about 2,500 years ago. It has no key at all. Once someone learns the trick, every message is open."},
 {name:"The Keyword", tool:"keyword",
  cipher:"L HKJB QENPES GEY AELSQ L QCKPS KJE. NKTEWKPT: CLPAKP",
  note:"My strongest lock. A keyword scrambles the whole alphabet, not just a slide or a fold. Type the keyword into the decoder to build the table. The wrong keyword builds the wrong table, and the message stays nonsense.",
  hints:["The Lock 3 message says your first codeword is the key.","If the message still looks like nonsense, check the spelling of the keyword."],
  ans:"EBOENU",
  named:"a keyword substitution cipher",
  why:"Any letter can stand for any other, so there are about 403 septillion possible tables (403 followed by 24 zeros). Trying them all would take far longer than a lifetime. So how did your crew get in? The keyword was sitting inside a weaker lock."}
];

const FINAL="A LOCK IS ONLY AS STRONG AS THE WAY YOU GUARD ITS KEY.";

let st={started:false,at:0,notes:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s.at==="number") st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let justSolved=null, shiftVal=0, kwVal="", confirmReset=false;

const $=s=>document.querySelector(s);
const stage=$("#stage");

function track(){
  const labels=["1","2","3","4","V"];
  $("#track").innerHTML=labels.map((l,i)=>{
    const cls=i<st.at?"done":(i===st.at&&st.started?"now":"");
    const t=i<4?`Lock ${i+1}`:"Vault";
    return `<div class="pip ${cls}" title="${t}${i<st.at?" open":""}">${i<st.at?"✓":l}</div>`;
  }).join("");
}

function resetZone(){
  const z=$("#resetZone");
  if(!st.started){z.innerHTML="";return;}
  z.innerHTML=confirmReset
    ?`<div class="confirm">Restart the mission? This clears your crew's progress on this computer. <button class="danger" id="rYes">Yes, restart</button><button class="ghost" id="rNo">Cancel</button></div>`
    :`<button class="ghost" id="rAsk">Restart mission</button>`;
  if(confirmReset){
    $("#rYes").onclick=()=>{st={started:false,at:0,notes:{}};save();confirmReset=false;justSolved=null;render();};
    $("#rNo").onclick=()=>{confirmReset=false;resetZone();};
  } else $("#rAsk").onclick=()=>{confirmReset=true;resetZone();};
}

function spin(){const b=$("#brand");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");}

function render(){
  track(); resetZone();
  if(!st.started) return intro();
  if(justSolved!==null) return reveal(justSolved);
  if(st.at<4) return lock(st.at);
  if(st.at===4) return vault();
  return win();
}

function intro(){
  stage.innerHTML=`<section class="card">
    <div class="eyebrow">Code Studio · Cybersecurity · Case file W-4</div>
    <h1 class="big">The Wren Vault</h1>
    <p class="lede">Agent Wren broke codes for forty years. On her last day, she locked one final message behind four ciphers and walked out the door. Each lock you open hands you the key to the next one. Can your crew reach the vault before the bell?</p>
    <div class="section">
      <div class="label">Before you start</div>
      <ul class="list">
        <li>Grab a pencil and scratch paper. Codebreakers write everything down.</li>
        <li>Pick crew roles and switch them at every lock. The <b>Reader</b> calls out the scrambled letters. The <b>Decoder</b> finds them in the table. The <b>Scribe</b> writes the real message.</li>
        <li>Stuck? Each lock has hints. Try as a crew first.</li>
      </ul>
    </div>
    <div class="safe"><b>This is a puzzle, not hacking.</b> You won't log into, break into, or touch any real system or account. Everything you need is on this page, and nothing you type leaves this computer.</div>
    <button class="go" id="start">Open the case file</button>
  </section>`;
  $("#start").onclick=()=>{st.started=true;save();render();window.scrollTo({top:0});};
}

function mapFor(tool){
  if(tool==="shift") return m=>A[(A.indexOf(m)-shiftVal+26)%26];
  if(tool==="mirror") return m=>A[25-A.indexOf(m)];
  const k=norm(kwVal);
  if(!k) return ()=>"?";
  const ca=[...new Set((k+A).split(""))].join("");
  return m=>A[ca.indexOf(m)];
}

function lock(i){
  const L=LOCKS[i];
  if(L.tool==="shift") shiftVal=0;
  if(L.tool==="keyword") kwVal="";
  const tape=L.cipher.split("").map(c=>A.includes(c)?`<span class="ml" data-l="${c}">${c}</span>`:(c===" "?" ":c)).join("");
  let ctl="";
  if(L.tool==="shift") ctl=`<div class="ctl">
      <span class="label">Shift back</span>
      <button class="step" id="minus" aria-label="Shift one less">−</button>
      <span class="num" id="num" aria-live="polite">0</span>
      <button class="step" id="plus" aria-label="Shift one more">+</button>
      <input type="range" id="rng" min="0" max="25" value="0" aria-label="Shift amount">
    </div>
    <div class="preview">First word at this shift: <b id="pv"></b></div>`;
  if(L.tool==="mirror") ctl=`<div class="legend">The fold is built in. A↔Z, B↔Y, C↔X, and so on.</div>`;
  if(L.tool==="keyword") ctl=`<div class="ctl"><label class="label" for="kw">Keyword</label><input class="keyin" id="kw" autocomplete="off" spellcheck="false" maxlength="20" placeholder="TYPE IT"></div>
    <div class="legend" id="kwl">No keyword yet, so the table is blank.</div>`;
  stage.innerHTML=`<section class="card">
    <div class="eyebrow">Lock ${i+1} of 4</div>
    <h2 class="h2">${L.name}</h2>
    <div class="section"><div class="label">Wren's note</div><p class="note">${L.note}</p></div>
    <div class="section"><div class="label">The scrambled message</div><div class="tape" id="tape">${tape}</div>
      <div class="legend">Tap any letter to find it in the decoder.</div></div>
    <div class="section"><div class="label">Decoder</div>
      <div class="dec">${ctl}
        <div class="grid" id="grid"></div>
        <div class="legend">Top row: the letter in the message. Bottom row: the real letter.</div>
      </div></div>
    <div class="section"><label class="label" for="notes">Crew notes</label>
      <textarea id="notes" placeholder="Write the decoded message here as you go." spellcheck="false"></textarea></div>
    <div class="section"><label class="label" for="cw">Enter the codeword</label>
      <form class="ans" id="form"><input id="cw" autocomplete="off" spellcheck="false" placeholder="CODEWORD"><button class="go" type="submit">Try the lock</button></form>
      <div class="msg" id="msg" role="status"></div></div>
    <div class="section"><div class="hints" id="hints"></div><button class="ghost" id="hbtn" style="align-self:flex-start">Show a hint</button></div>
  </section>`;

  let hl=null;
  const grid=$("#grid");
  function draw(){
    const f=mapFor(L.tool);
    grid.innerHTML=A.split("").map(m=>`<div class="cell${m===hl?" hl":""}" data-l="${m}"><span class="t">${m}</span><span class="b">${f(m)}</span></div>`).join("");
    if(L.tool==="shift"){
      $("#num").textContent=shiftVal; $("#rng").value=shiftVal;
      const w=L.cipher.split(" ")[0].replace(/[^A-Z]/g,"");
      $("#pv").textContent=w.split("").map(f).join("");
    }
  }
  function pick(l){
    hl=(hl===l)?null:l;
    document.querySelectorAll("#tape .ml").forEach(s=>s.classList.toggle("hl",s.dataset.l===hl));
    draw();
  }
  $("#tape").onclick=e=>{const s=e.target.closest(".ml"); if(s) pick(s.dataset.l);};
  grid.onclick=e=>{const c=e.target.closest(".cell"); if(c) pick(c.dataset.l);};
  if(L.tool==="shift"){
    $("#minus").onclick=()=>{shiftVal=(shiftVal+25)%26;draw();};
    $("#plus").onclick=()=>{shiftVal=(shiftVal+1)%26;draw();};
    $("#rng").oninput=e=>{shiftVal=+e.target.value;draw();};
  }
  if(L.tool==="keyword"){
    $("#kw").oninput=e=>{kwVal=e.target.value;const k=norm(kwVal);
      $("#kwl").textContent=k?`Keyword alphabet: ${[...new Set((k+A).split(""))].join("")}`:"No keyword yet, so the table is blank.";draw();};
  }
  draw();

  const notes=$("#notes"); notes.value=(st.notes&&st.notes[i])||"";
  notes.oninput=()=>{st.notes=st.notes||{};st.notes[i]=notes.value;save();};

  let shown=0;
  $("#hbtn").onclick=()=>{
    if(shown<L.hints.length){$("#hints").insertAdjacentHTML("beforeend",`<div class="hint"><b>Hint ${shown+1}:</b> ${L.hints[shown]}</div>`);shown++;}
    if(shown>=L.hints.length) $("#hbtn").hidden=true;
  };
  $("#form").onsubmit=e=>{
    e.preventDefault();
    const v=norm($("#cw").value);
    const m=$("#msg");
    if(!v){m.className="msg bad";m.textContent="Type a codeword first.";return;}
    if(v===unob(L.ans)){st.at=i+1;save();justSolved=i;spin();render();window.scrollTo({top:0,behavior:"smooth"});}
    else{m.className="msg bad";m.textContent=`"${v}" doesn't open Lock ${i+1}. Check your table and try again.`;}
  };
}

function plainOf(i){
  const L=LOCKS[i];
  let f;
  if(L.tool==="shift"){const k=i===0?3:11; f=m=>A[(A.indexOf(m)-k+26)%26];}
  else if(L.tool==="mirror") f=m=>A[25-A.indexOf(m)];
  else {const ca=[...new Set((unob(LOCKS[0].ans)+A).split(""))].join(""); f=m=>A[ca.indexOf(m)];}
  return L.cipher.split("").map(c=>A.includes(c)?f(c):c).join("");
}

function reveal(i){
  const L=LOCKS[i], next=i<3?`Go to Lock ${i+2}`:"Go to the vault";
  stage.innerHTML=`<section class="card reveal">
    <div class="stamp">Lock ${i+1} open</div>
    <div class="section"><div class="label">Wren's message, decoded</div><div class="plain">${plainOf(i)}</div></div>
    <h2 class="h2">You just cracked ${L.named}.</h2>
    <p class="lede">${L.why}</p>
    <button class="go" id="next">${next}</button>
  </section>`;
  $("#next").onclick=()=>{justSolved=null;render();window.scrollTo({top:0});};
}

function vault(){
  const opts=[
    {t:"The Shift. Nobody will ever guess the number.",fb:"Your crew found the number in Lock 2 with at most 25 tries. Anyone else can too."},
    {t:"The Mirror. It's the fastest one to use.",fb:"Fast, but the Mirror has no key. Anyone who knows the trick can read every message."},
    {t:"The Keyword, and hide the keyword inside a Shift message so it's extra safe.",fb:"That is exactly what Wren did, and it is how your crew got in. A weak lock guarding the key makes the strong lock weak too."},
    {t:"The Keyword, and keep the keyword out of every other message.",ok:true}
  ];
  stage.innerHTML=`<section class="card">
    <div class="eyebrow">The vault</div>
    <h2 class="h2">One question stands between you and the vault.</h2>
    <p class="note">Tomorrow I have to lock one more message, and this time it really matters. You've broken all four of my locks. Tell me which one I should use, and how.</p>
    <div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>
    <div id="fb" role="status"></div>
  </section>`;
  $("#opts").onclick=e=>{
    const b=e.target.closest(".opt"); if(!b) return;
    const o=opts[+b.dataset.k];
    if(o.ok){st.at=5;save();spin();render();window.scrollTo({top:0,behavior:"smooth"});return;}
    b.classList.add("wrong");
    $("#fb").innerHTML=`<div class="fb"><b>The vault stays shut.</b> ${o.fb}</div>`;
  };
}

function win(){
  stage.innerHTML=`<section class="card reveal">
    <div class="stamp">Vault open</div>
    <div class="section"><div class="label">Wren's last message</div><div class="final" id="final"></div></div>
    <h2 class="h2">Wren built a strong lock, then guarded its key with a weak one.</h2>
    <p class="lede">She never planned for that, and it's how you got in. Real systems break the same way. A company can use powerful encryption and still get broken into because a key or password was stored somewhere careless.</p>
    <div class="section"><div class="label">What you learned today</div>
      <ul class="list">
        <li><b>Key size matters.</b> The Shift had 25 keys. The Keyword had about 403 septillion. More possible keys means a harder lock to guess.</li>
        <li><b>Guarding the key matters just as much.</b> The strongest lock is only as safe as the place its key is kept.</li>
        <li>The encryption on websites you visit uses these same two ideas, with keys so long that trying them all would take longer than the age of the universe.</li>
      </ul></div>
    <div class="section"><div class="label">Crew check · talk it over, nothing to turn in</div>
      <ul class="list">
        <li><b>Persistence:</b> Lock 2 had no key, and your crew kept trying shifts until one worked. Which lock almost made you quit, and what kept you going?</li>
        <li><b>Teamwork:</b> When did switching roles or splitting up the work get your crew unstuck?</li>
      </ul></div>
  </section>`;
  const el=$("#final");
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){el.textContent=FINAL;return;}
  let n=0; const total=FINAL.length;
  const t=setInterval(()=>{
    n+=1;
    el.textContent=FINAL.split("").map((c,k)=>k<n||!A.includes(c)?c:A[Math.floor(Math.random()*26)]).join("");
    if(n>=total){clearInterval(t);el.textContent=FINAL;}
  },45);
}

render();
})();
</script>

</body></html>
